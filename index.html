<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祝福集</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 90% at 50% 100%, #0e1c40 0%, #081128 45%, #04070f 100%) #04070f;
    color: #eef4ff; font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    padding: 24px; box-sizing: border-box;
  }
  h1 { margin: 0 0 14px; font-weight: 400; font-size: clamp(28px, 6vw, 44px); letter-spacing: 0.4em; padding-left: 0.4em; color: #ffd58a; }
  p { margin: 0; letter-spacing: 0.2em; color: rgba(226, 236, 255, 0.62); font-size: 14px; }
</style>
</head>
<body>
  <main>
    <h1>祝福集</h1>
    <p>每一页，都是写给一个人的。</p>
  </main>
</body>
</html>
