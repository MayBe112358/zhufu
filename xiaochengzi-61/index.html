<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小橙子🍊 · 六一儿童节快乐</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          orange1: '#FF8C00',
          orange2: '#FFB300',
          orange3: '#FFDD80',
        },
        fontFamily: {
          cute: ['"Comic Sans MS"', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
        },
        keyframes: {
          floaty: {
            '0%,100%': { transform: 'translateY(0) rotate(-2deg)' },
            '50%': { transform: 'translateY(-22px) rotate(2deg)' },
          },
          balloonUp: {
            '0%': { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: '0' },
            '10%': { opacity: '1' },
            '90%': { opacity: '1' },
            '100%': { transform: 'translateY(-115vh) translateX(40px) rotate(8deg)', opacity: '0' },
          },
          twinkle: {
            '0%,100%': { opacity: '0.3', transform: 'scale(0.8)' },
            '50%': { opacity: '1', transform: 'scale(1.2)' },
          },
          pop: {
            '0%': { transform: 'scale(0.6)', opacity: '0' },
            '60%': { transform: 'scale(1.08)', opacity: '1' },
            '100%': { transform: 'scale(1)', opacity: '1' },
          },
          wiggle: {
            '0%,100%': { transform: 'rotate(0deg)' },
            '25%': { transform: 'rotate(-8deg)' },
            '75%': { transform: 'rotate(8deg)' },
          },
        },
        animation: {
          floaty: 'floaty 3.5s ease-in-out infinite',
          twinkle: 'twinkle 2.5s ease-in-out infinite',
          pop: 'pop 0.4s ease-out',
          wiggle: 'wiggle 0.6s ease-in-out',
        },
      },
    },
  };
</script>
<style>
  body {
    background: linear-gradient(160deg, #FFEFD5 0%, #FFF6E6 40%, #FFFFFF 100%);
    overflow-x: hidden;
  }
  /* 气球 */
  .balloon {
    position: fixed;
    bottom: -120px;
    width: 46px;
    height: 58px;
    border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
    z-index: 1;
    pointer-events: none;
    box-shadow: inset -6px -8px 12px rgba(0,0,0,0.12);
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -42px;
    left: 50%;
    width: 1px;
    height: 44px;
    background: rgba(180,140,90,0.5);
    transform: translateX(-50%);
  }
  .balloon::before {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    width: 8px;
    height: 8px;
    transform: translateX(-50%) rotate(45deg);
    background: inherit;
  }
  .star {
    position: fixed;
    color: #FFB300;
    z-index: 1;
    pointer-events: none;
    user-select: none;
  }
  #confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
  }
  .orange-shadow {
    filter: drop-shadow(0 18px 22px rgba(255,140,0,0.35));
  }
</style>
</head>
<body class="font-cute min-h-screen relative">

  <!-- 飘落彩带 canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 背景装饰星星 -->
  <div class="star animate-twinkle text-3xl" style="top:12%;left:8%;">⭐</div>
  <div class="star animate-twinkle text-2xl" style="top:22%;right:10%;animation-delay:.6s;">✨</div>
  <div class="star animate-twinkle text-4xl" style="top:65%;left:6%;animation-delay:1.1s;">⭐</div>
  <div class="star animate-twinkle text-2xl" style="top:78%;right:8%;animation-delay:.3s;">🌟</div>
  <div class="star animate-twinkle text-3xl" style="top:40%;right:4%;animation-delay:1.4s;">✨</div>
  <div class="star animate-twinkle text-2xl" style="top:50%;left:4%;animation-delay:.9s;">🌟</div>

  <!-- 主内容 -->
  <main class="relative z-10 flex flex-col items-center px-5 py-8 sm:py-12 min-h-screen">

    <!-- 顶部小标题 -->
    <div class="mb-6 sm:mb-10 px-6 py-2 rounded-full bg-white/70 backdrop-blur shadow-md border-2 border-orange3">
      <h2 class="text-orange1 font-bold tracking-widest text-sm sm:text-lg">🎈 六一儿童节 · 快乐 🎈</h2>
    </div>

    <!-- 中央橙子 -->
    <div class="flex-1 flex flex-col items-center justify-center text-center max-w-2xl w-full">

      <button id="orange-btn" aria-label="点击橙子"
        class="orange-shadow animate-floaty mb-8 focus:outline-none active:scale-95 transition-transform">
        <!-- SVG 卡通橙子 -->
        <svg width="170" height="170" viewBox="0 0 200 200" class="w-36 h-36 sm:w-48 sm:h-48">
          <!-- 叶子 -->
          <ellipse cx="118" cy="34" rx="26" ry="14" fill="#7CC242" transform="rotate(28 118 34)"/>
          <ellipse cx="118" cy="34" rx="11" ry="5" fill="#9BDB5A" transform="rotate(28 118 34)"/>
          <!-- 蒂 -->
          <rect x="95" y="20" width="10" height="22" rx="5" fill="#A0671F"/>
          <!-- 橙子主体 -->
          <circle cx="100" cy="115" r="78" fill="#FF8C00"/>
          <circle cx="100" cy="115" r="78" fill="url(#grad)"/>
          <!-- 高光 -->
          <ellipse cx="72" cy="82" rx="24" ry="16" fill="#FFDD80" opacity="0.65"/>
          <!-- 腮红 -->
          <circle cx="58" cy="128" r="13" fill="#FF6B6B" opacity="0.45"/>
          <circle cx="142" cy="128" r="13" fill="#FF6B6B" opacity="0.45"/>
          <!-- 眼睛 -->
          <circle cx="76" cy="108" r="11" fill="#3a2a1a"/>
          <circle cx="124" cy="108" r="11" fill="#3a2a1a"/>
          <circle cx="80" cy="104" r="4" fill="#fff"/>
          <circle cx="128" cy="104" r="4" fill="#fff"/>
          <!-- 微笑嘴巴 -->
          <path d="M82 135 Q100 156 118 135" stroke="#3a2a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <defs>
            <radialGradient id="grad" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#FFB300"/>
              <stop offset="100%" stop-color="#FF8C00"/>
            </radialGradient>
          </defs>
        </svg>
      </button>

      <h1 class="text-2xl sm:text-4xl font-extrabold text-orange1 leading-snug mb-4 drop-shadow-sm">
        小橙子🍊，六一儿童节快乐！
      </h1>

      <p class="text-base sm:text-xl text-amber-700/90 font-semibold leading-relaxed px-2">
        愿你永远像今天一样开心、无忧无虑，<br class="hidden sm:block"/>
        像小太阳一样闪闪发光～ ☀️
      </p>

      <p class="mt-4 text-sm text-orange-400 animate-pulse">👆 点点小橙子，有惊喜哦</p>
    </div>

    <!-- 再祝一次按钮 -->
    <button id="celebrate-btn"
      class="mt-10 mb-2 px-8 py-4 rounded-full text-white text-lg font-bold
             bg-gradient-to-r from-orange1 to-orange2 shadow-lg
             hover:shadow-xl hover:-translate-y-1 active:translate-y-0 transition-all
             border-4 border-white">
      🎉 再祝一次 🎉
    </button>
  </main>

  <!-- 点击橙子弹出的祝福气泡（位置由 JS 随机设置） -->
  <div id="wish-toast"
    class="fixed z-[60] hidden w-[80vw] max-w-xs sm:max-w-sm px-6 py-5 rounded-3xl text-center
           bg-white shadow-2xl border-4 border-orange3">
    <p class="text-2xl mb-1">🍊✨</p>
    <p id="wish-text" class="text-orange1 font-bold text-lg sm:text-xl leading-relaxed"></p>
  </div>

<script>
  /* ===== 气球生成 ===== */
  const balloonColors = ['#FF8C00', '#FFB300', '#FF6B6B', '#7CC8FF', '#9BDB5A', '#C49BFF', '#FF9FC7'];
  function spawnBalloon() {
    const b = document.createElement('div');
    b.className = 'balloon';
    const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
    b.style.background = color;
    b.style.left = Math.random() * 92 + 'vw';
    const dur = 9 + Math.random() * 7;
    const scale = 0.7 + Math.random() * 0.8;
    b.style.transform = `scale(${scale})`;
    b.style.animation = `balloonUp ${dur}s linear forwards`;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000 + 200);
  }
  setInterval(spawnBalloon, 1400);
  for (let i = 0; i < 4; i++) setTimeout(spawnBalloon, i * 500);

  /* ===== 点击橙子弹出祝福 ===== */
  const wishes = [
    '小橙子，你笑起来比阳光还要灿烂哦！😄',
    '愿你每天都有甜甜的糖果和满满的快乐～🍬',
    '永远做那个勇敢又可爱的小朋友！💪',
    '你是世界上最闪亮的小橙子✨',
    '希望你的梦想都能像气球一样飞得高高的🎈',
    '今天的你，可爱值已经爆表啦！💯',
    '抱抱小橙子，把所有烦恼都赶跑～🤗',
    '愿你被这个世界温柔以待，永远天真无邪🌈',
  ];
  const orangeBtn = document.getElementById('orange-btn');
  const toast = document.getElementById('wish-toast');
  const wishText = document.getElementById('wish-text');
  let toastTimer = null;
  orangeBtn.addEventListener('click', () => {
    orangeBtn.classList.remove('animate-floaty');
    orangeBtn.classList.add('animate-wiggle');
    setTimeout(() => {
      orangeBtn.classList.remove('animate-wiggle');
      orangeBtn.classList.add('animate-floaty');
    }, 600);

    wishText.textContent = wishes[Math.floor(Math.random() * wishes.length)];

    // 先显示再测量尺寸，随机定位且确保完整留在屏幕内（含安全边距）
    toast.classList.remove('hidden');
    toast.classList.remove('animate-pop');
    void toast.offsetWidth; // 重置动画
    const margin = 12;
    const tw = toast.offsetWidth;
    const th = toast.offsetHeight;
    const maxX = Math.max(margin, innerWidth - tw - margin);
    const maxY = Math.max(margin, innerHeight - th - margin);
    const x = margin + Math.random() * (maxX - margin);
    const y = margin + Math.random() * (maxY - margin);
    toast.style.left = x + 'px';
    toast.style.top = y + 'px';
    toast.classList.add('animate-pop');
    burstConfetti(40);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
      toast.classList.remove('animate-pop');
    }, 2600);
  });

  /* ===== 彩带 canvas ===== */
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  const confettiColors = ['#FF8C00', '#FFB300', '#FFDD80', '#FF6B6B', '#7CC8FF', '#9BDB5A', '#C49BFF', '#FF9FC7'];
  let particles = [];

  function addParticles(n, fromTop) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: Math.random() * W,
        y: fromTop ? -20 - Math.random() * H * 0.3 : H / 2,
        size: 5 + Math.random() * 7,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: fromTop ? 1.5 + Math.random() * 2.5 : -4 - Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        shape: Math.random() > 0.5 ? 'rect' : 'circle',
        life: 1,
      });
    }
  }

  function burstConfetti(n) { addParticles(n, false); }

  let running = false;
  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // 重力
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    particles = particles.filter(p => p.y < H + 30);
    if (particles.length > 0) {
      requestAnimationFrame(loop);
      running = true;
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }
  function startLoop() { if (!running) loop(); }

  /* 页面加载时飘落彩带 */
  window.addEventListener('load', () => {
    addParticles(90, true);
    startLoop();
  });

  /* 再祝一次按钮：彩带庆祝 */
  document.getElementById('celebrate-btn').addEventListener('click', () => {
    addParticles(120, true);
    burstConfetti(60);
    startLoop();
  });
</script>
</body>
</html>
